name: PrecinctWeather
options:
  bundleIdPrefix: com.gaoe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
schemes:
  PrecinctKitTests:
    build:
      targets:
        PrecinctKit: test
        PrecinctKitTests: test
    test:
      config: Debug
      targets:
        - PrecinctKitTests
  # The UI test target depends on the app, so xcodebuild builds it. Do NOT list PrecinctWeather
  # under build.targets here: XcodeGen then stops auto-generating the `PrecinctWeather` scheme,
  # which is the one every build/deploy command in the build-and-deploy skill uses.
  PrecinctWeatherUITests:
    build:
      targets:
        PrecinctWeatherUITests: test
    test:
      config: Debug
      targets:
        - PrecinctWeatherUITests
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.03"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "MMB64J942P"   # personal team; update after Developer Program enrollment

targets:
  PrecinctKit:
    type: framework
    platform: iOS
    sources:
      - PrecinctKit/Sources
      - PrecinctKit/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoe.PrecinctKit
        INFOPLIST_FILE: PrecinctKit/Info.plist
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: libsqlite3.tbd

  PrecinctKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrecinctKit/Tests
      - App/Support/SearchResolutionGate.swift
      - App/Share/ShareCardElectionPresentation.swift
      - Widget/WidgetLocationPolicy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoe.PrecinctKitTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PrecinctKit
      - sdk: libsqlite3.tbd

  PrecinctWeather:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoe.PrecinctWeather
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor   # slate ink; blue means Democrat, so don't default the chrome to system blue
    dependencies:
      - target: PrecinctKit
        embed: true
      - target: PrecinctWidgetExtension
        embed: true

  PrecinctWeatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoe.PrecinctWeatherUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PrecinctWeather

  PrecinctWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaoe.PrecinctWeather.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PrecinctKit
        embed: false
